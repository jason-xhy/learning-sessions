<!doctype html><html><head><meta charset="utf-8"><title>webgl smoke</title></head>
<body style="margin:0;background:#111">
<canvas id="c" width="400" height="300"></canvas>
<script type="module">
import * as THREE from "../vendor/three.module.min.js";
const r = new THREE.WebGLRenderer({canvas: document.getElementById("c"), antialias: true});
r.setSize(400, 300);
const s = new THREE.Scene(); s.background = new THREE.Color(0x224488);
const cam = new THREE.PerspectiveCamera(50, 400/300, 0.1, 100); cam.position.z = 5;
const m = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshStandardMaterial({color: 0xff8800}));
s.add(m); s.add(new THREE.AmbientLight(0xffffff, 2));
r.render(s, cam);
document.title = "three-" + THREE.REVISION + "-ok";
window.__smoke = { rev: THREE.REVISION, pixels: (() => { const g = new Uint8Array(4*100); r.readRenderTargetPixels ? null : null; const gl = r.getContext(); gl.readPixels(200,150,1,1,gl.RGBA,gl.UNSIGNED_BYTE,g); return Array.from(g.slice(0,4)); })() };
</script></body></html>
