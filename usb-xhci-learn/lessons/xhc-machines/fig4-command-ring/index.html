.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}

@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

      const countOf = (level) => (level.groups.get(tone) ?? []).length;

      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }
  }
  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;
  const from = typeof start === "function" ? start : (t) => saddleStart(start, a, t);
  const low = Array.from({ length: n }, (_, j) => iso(pointOf(F, from(angle(j)), a, angle(j)), P));
  const high = Array.from({ length: n }, (_, j) => iso(pointOf(F, s1, a, angle(j)), P));
  const seen = [];
  const tones = [];
  for (let j = 0; j < n; j++) {
    const normal = radialOf(F, angle(j + 0.5));
    seen.push(dot3(normal, V) > 1e-6);
    tones.push(bandOf(dot3(normal, L)));
  }
  const buckets = [[], [], [], [], []];
  const fills = [];
  const keys = seen.map((visible, j) => (visible ? tones[j] : null));
  for (const { key, run } of groupsOf(keys)) {
    const d = pathOf(oriented([...run.map((j) => low[j]), ...run.map((j) => high[j]).reverse()]), true);
    buckets[key].push(d);
    fills.push(d);
  }
  const capSeen = dot3(F.a, V) > 1e-6;
  if (capSeen) {
    const d = pathOf(oriented(high), true);
    buckets[bandOf(dot3(F.a, L))].push(d);
    fills.push(d);
  }
  const front = runsOf(seen);
  const back = runsOf(seen.map((visible) => !visible));
  const edges = [];
  for (const run of front) {
    edges.push(pathOf(run.map((j) => low[j])));
    edges.push(pathOf([low[run[0]], high[run[0]]]), pathOf([low[run[run.length - 1]], high[run[run.length - 1]]]));
  }
  for (const run of capSeen ? back : front) edges.push(pathOf(run.map((j) => high[j])));
  return {
    fill: fills.join(""),
    outline: edges.join(""),
    crease: capSeen ? front.map((run) => pathOf(run.map((j) => high[j]))).join("") : "",
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    seamless: true,
  };
}

function prismOf(F, polygon, s0, s1, P) {
  const V = viewOf(P);
  const L = lightOf(P);
  const ring = oriented(polygon.map(([x, y]) => [x, y]));
  const n = ring.length;
  const at = (s, [x, y]) => [F.o[0] + F.a[0] * s + F.u[0] * x + F.v[0] * y, F.o[1] + F.a[1] * s + F.u[1] * x + F.v[1] * y, F.o[2] + F.a[2] * s + F.u[2] * x + F.v[2] * y];
  const low = ring.map((point) => iso(at(s0, point), P));
  const high = ring.map((point) => iso(at(s1, point), P));
  const buckets = [[], [], [], [], []];
  const seen = [];
  for (let j = 0; j < n; j++) {
    const [x0, y0] = ring[j];
    const [x1, y1] = ring[(j + 1) % n];
    const normal = unit3(add3(mul3(F.u, y1 - y0), mul3(F.v, -(x1 - x0))));
    const visible = dot3(normal, V) > 1e-6;
    seen.push(visible);
    if (visible) buckets[bandOf(dot3(normal, L))].push(pathOf([low[j], low[(j + 1) % n], high[(j + 1) % n], high[j]], true));
  }
  const ends = [[s0, low, mul3(F.a, -1)], [s1, high, F.a]];
  const capSeen = ends.map(([, , normal]) => dot3(normal, V) > 1e-6);
  ends.forEach(([, points, normal], index) => capSeen[index] && buckets[bandOf(dot3(normal, L))].push(pathOf(points, true)));
  const hull = hullOf([...low, ...high]);
  const creases = [];
  for (let j = 0; j < n; j++) {
    const prev = (j - 1 + n) % n;
    const a = [ring[j][0] - ring[prev][0], ring[j][1] - ring[prev][1]];
    const b = [ring[(j + 1) % n][0] - ring[j][0], ring[(j + 1) % n][1] - ring[j][1]];
    const sharp = (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(a[0], a[1]) * Math.hypot(b[0], b[1]) || 1) < Math.cos(0.35);
    if (sharp && seen[j] && seen[prev]) creases.push(pathOf([low[j], high[j]]));
    ends.forEach(([, points], index) => capSeen[index] && seen[j] && creases.push(pathOf([points[j], points[(j + 1) % n]])));
  }
  return { fill: pathOf(hull, true), outline: pathOf(hull, true), crease: creases.join(""), top: buckets[4].join(""), shades: buckets.slice(0, 4).map((list) => list.join("")) };
}

function stadium(r0, r1, offset, steps = 32) {
  const circle = (cx, r) => Array.from({ length: steps }, (_, index) => [cx + r * Math.cos((index / steps) * TAU), r * Math.sin((index / steps) * TAU)]);
  return hullOf([...circle(0, r0), ...circle(offset, r1)]);
}

function sphereOf(centre, r, P, { steps = 48 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const F = frameAlong(centre, V);
  const flat = (p) => iso(p, P);
  const rim = Array.from({ length: steps }, (_, index) => pointOf(F, 0, r, (index / steps) * TAU));
  const outline = pathOf(rim.map(flat), true);
  const capOf = (threshold) => {
    const points = rim.filter((p) => dot3(sub3(p, centre), L) / r >= threshold).map(flat);
    const c = dot3(L, V);
    const LF = frameAlong(add3(centre, mul3(L, r * threshold)), L);
    const radius = r * Math.sqrt(Math.max(0, 1 - threshold * threshold));
    for (let index = 0; index < steps; index++) {
      const p = pointOf(LF, 0, radius, (index / steps) * TAU);
      if (dot3(sub3(p, centre), V) >= -1e-9) points.push(flat(p));
    }
    if (c > threshold) points.push(flat(add3(centre, mul3(V, r))));
    return points.length > 2 ? pathOf(hullOf(points), true) : "";
  };
  const shades = [outline, capOf(BANDS[1]), capOf(BANDS[2]), capOf(BANDS[3])];
  return { fill: outline, outline, crease: "", top: "", shades, seamless: true };
}

const disc = (s0, s1, r, F, P, options = {}) =>
  lathe(
    [
      [s0, 0],
      [s0, r],
      [s1, r],
      [s1, 0],
    ],
    F,
    P,
    { steps: stepsFor(r, 32, 160, scaleOf(P)), ...options },
  );

const ringBand = (s0, s1, rIn, rOut, F, P, options = {}) =>
  lathe(
    [
      [s0, rIn],
      [s0, rOut],
      [s1, rOut],
      [s1, rIn],
    ],
    F,
    P,
    { steps: stepsFor(rOut, 32, 160, scaleOf(P)), hole: null, ...options },
  );

function solidOf(profile, F, P, options = {}) {
  const first = profile[0];
  const last = profile[profile.length - 1];
  const meridian = [[first[0], 0], ...profile, [last[0], 0]];
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(meridian, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function bandOfProfile(profile, F, P, options = {}) {
  const most = Math.max(...profile.map(([, r]) => r));
  return lathe(profile, F, P, { steps: stepsFor(most, 32, 160, scaleOf(P)), ...options });
}

function silhouettePoints(profile, F, P, { samples = 72, slope: given = null, radius = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const facing = Math.atan2(vV, uV);
  const flat = Math.hypot(uV, vV) || 1e-9;
  const s0 = profile[0][0];
  const s1 = profile[profile.length - 1][0];
  const radiusAt = radius ?? ((s) => {
    let index = 1;
    while (index < profile.length - 1 && profile[index][0] < s) index++;
    const [sa, ra] = profile[index - 1];
    const [sb, rb] = profile[index];
    return ra + ((rb - ra) * (s - sa)) / (sb - sa || 1);
  });
  const side = (sign) => {
    const points = [];
    for (let step = 0; step <= samples; step++) {
      const s = s0 + ((s1 - s0) * step) / samples;
      const h = (s1 - s0) / samples / 2 || 0.01;
      const slope = given ? given(s) : (radiusAt(Math.min(s1, s + h)) - radiusAt(Math.max(s0, s - h))) / (Math.min(s1, s + h) - Math.max(s0, s - h) || 1);
      const c = (slope * aV) / flat;
      if (Math.abs(c) > 1) continue;
      points.push(pointOf(F, s, radiusAt(s), facing + sign * Math.acos(c)));
    }
    return points;
  };
  return [side(1), side(-1)];
}

const silhouetteOf = (profile, F, P, options = {}) =>
  silhouettePoints(profile, F, P, options)
    .map((points) => pathOf(points.map((point) => iso(point, P))))
    .join("");

function profileCurve(profile, { slope = null, radius = null } = {}) {
  for (let index = 1; index < profile.length; index++) if (profile[index][0] - profile[index - 1][0] <= 1e-9) throw new Error(`profileCurve: s must rise along the profile (point ${index} at s = ${profile[index][0]})`);

// ---------- helpers ----------
const seg = (t, a, b) => (t <= a ? 0 : t >= b ? 1 : (t - a) / (b - a));
const ease = (u) => u * u * (3 - 2 * u);
const lerp = (a, b, u) => a + (b - a) * u;
const mix3 = (A, B, u) => [lerp(A[0], B[0], u), lerp(A[1], B[1], u), lerp(A[2], B[2], u)];
const isoP = (p) => iso(p, P);
const pol = (aDeg, r) => [D.cx + r * Math.cos(aDeg * RAD), D.cy + r * Math.sin(aDeg * RAD)];

// ---------- jib keyframes ----------
const J = D.jib;
const DESK = [J.deskA, J.deskR, J.cruiseZ];
function jibKeys(fr, t) {
  if (fr <= 1) return DESK.slice();
  const s = fr === 2 ? 0 : fr === 3 ? 1 : 2;
  const A = [D.slotA[s], SLOT_R, J.cruiseZ];
  if (fr === 2) {
    if (t < 0.18) return mix3(DESK, A, ease(seg(t, 0.02, 0.18)));
    if (t < 0.24) return [D.slotA[s], SLOT_R, lerp(J.cruiseZ, 67, ease(seg(t, 0.18, 0.24)))];
    if (t < 0.40) return mix3(A, [J.deskA, J.deskR, 67], ease(seg(t, 0.24, 0.40)));
    if (t < 0.46) return [J.deskA, J.deskR, lerp(67, 69.5, ease(seg(t, 0.40, 0.46)))];
    if (t < 0.54) return [J.deskA, J.deskR, lerp(69.5, J.cruiseZ, ease(seg(t, 0.46, 0.54)))];
    return DESK.slice();
  }
  const t0 = fr === 3 ? 0.66 : 0.64, t1 = fr === 3 ? 0.78 : 0.76;
  const t2 = t1 + 0.06, t3 = fr === 3 ? 0.93 : 0.92, t4 = t3 + 0.03, t5 = Math.min(1, t4 + 0.04);
  if (t < t1) return mix3(DESK, A, ease(seg(t, t0, t1)));
  if (t < t2) return [D.slotA[s], SLOT_R, lerp(J.cruiseZ, 67, ease(seg(t, t1, t2)))];
  if (t < t3) return mix3(A, [J.deskA, J.deskR, 67], ease(seg(t, t2, t3)));
  if (t < t4) return [J.deskA, J.deskR, lerp(67, 69.5, ease(seg(t, t3, t4)))];
  return [J.deskA, J.deskR, lerp(69.5, J.cruiseZ, ease(seg(t, t4, t5)))];
}

// ---------- tray state machine ----------
const HOME = (c) => [...D.mag[c - 1], D.topz + 0.75 + 1.65 * (c - 1)];
const STAMKP = () => [...D.stampPt, D.topz + 0.75];
const READP = () => [...D.readPt, D.topz + 0.75];
const SLOTP = (c) => [...D.SLOT[c - 1], D.topz + 4.5];
const DESKP = () => [...D.deskDrop, D.topz + 10.5];
function pathLegs(c, fr) {
  const H = HOME(c), ST = STAMKP(), RD = READP(), SL = SLOTP(c);
  if (c === 1 && fr === 1) return [
    { t0: 0.02, t1: 0.14, from: H, to: ST },
    { t0: 0.24, t1: 0.36, from: ST, to: RD },
    { t0: 0.46, t1: 0.58, from: RD, to: SL, arc: 7 },
  ];
  if (c === 2 && fr === 3) return [
    { t0: 0.06, t1: 0.16, from: H, to: ST },
    { t0: 0.26, t1: 0.36, from: ST, to: RD },
    { t0: 0.46, t1: 0.56, from: RD, to: SL, arc: 7 },
  ];
  if (c === 3 && fr === 4) return [
    { t0: 0.06, t1: 0.16, from: H, to: ST },
    { t0: 0.26, t1: 0.36, from: ST, to: RD },
    { t0: 0.44, t1: 0.54, from: RD, to: SL, arc: 7 },
  ];
  return null;
}
function trayState(c, fr, t) {
  const st = { p: HOME(c), vis: true, etch: false, op: 1 };
  const CARRY = fr === 2 ? [0.24, 0.40, 0.46] : fr === 3 ? [0.84, 0.93, 0.96] : fr === 4 ? [0.82, 0.92, 0.95] : null;
  if (c === 1 && fr > 2) return { p: DESKP(), vis: false, etch: true, op: 0 };
  if (c === 2 && fr > 3) return { p: DESKP(), vis: false, etch: true, op: 0 };
  if (c === 3 && fr === 0) return { p: DESKP(), vis: false, etch: true, op: 0 };
  if (fr === 0 || pathLegs(c, fr) === null) {
    if (CARRY === null) return st; // 在料架上待命
  }
  const legs = pathLegs(c, fr);
  if (legs) {
    let p = legs[0].from;
    for (const L of legs) {
      if (t >= L.t0) {
        const u = ease(seg(t, L.t0, L.t1));
        p = mix3(L.from, L.to, u);
        if (L.arc) p = [p[0], p[1], p[2] + Math.sin(u * Math.PI) * L.arc];
      }
    }
    st.p = p;
    if (t >= (c === 1 ? 0.18 : 0.20)) st.etch = true;
    return st;
  }
  if (CARRY) {
    const [g0, g1, drop] = CARRY;
    const keys = jibKeys(fr, t);
    if (t < g0) { st.p = SLOTP(c); st.etch = true; return st; }
    if (t < g1) {
      const xy = pol(keys[0], keys[1]);
      st.p = [xy[0], xy[1], keys[2] - 4.5];
      st.etch = true;
      return st;
    }
    if (t < drop) {
      const u = ease(seg(t, g1, drop));
      st.p = [...D.deskDrop, lerp(D.topz + 4.25, D.topz + 10.5, u)];
      st.etch = true;
      return st;
    }
    st.p = DESKP();
    st.etch = true;
    const fade0 = fr === 2 ? 0.80 : 0.965, fade1 = fr === 2 ? 0.90 : 1.0;
    st.op = 1 - ease(seg(t, fade0, fade1));
    if (st.op <= 0.01) st.vis = false;
    return st;
  }
  return st;
}

// ---------- presses / receipt / plate ----------
function bellP(t, a, b, c) { return ease(seg(t, a, b)) * (1 - ease(seg(t, b, c))); }
function stampPress(fr, t) {
  if (fr === 1) return bellP(t, 0.14, 0.19, 0.26);
  if (fr === 3 || fr === 4) return bellP(t, 0.16, 0.21, 0.28);
  return 0;
}
function deskPress(fr, t) {
  if (fr === 2) return bellP(t, 0.46, 0.51, 0.58);
  if (fr === 3) return bellP(t, 0.93, 0.955, 0.99);
  if (fr === 4) return bellP(t, 0.92, 0.945, 0.98);
  return 0;
}
let plateLatched = !!D.plateLatched; // 截图/审计辅助：直挂 1 号格（正常构建为 false）
function plateState(fr, t) {
  if (fr > 2 || (fr === 2 && t >= 0.97)) plateLatched = true;
  if (fr < 2 && !plateLatched) return { on: false };
  if (plateLatched) return { on: true, p: [...D.docCell, 0], op: 1 };
  if (t < 0.60) return { on: false };
  const u1 = ease(seg(t, 0.60, 0.74)), u2 = ease(seg(t, 0.74, 0.86)), u3 = ease(seg(t, 0.86, 0.97));
  const A = [...D.docStart, 58], B = [D.docCorner[0], D.docCorner[1], 58], C = [D.docElbow[0], D.docElbow[1], 58], E = D.docCell;
  let p;
  if (u3 > 0) p = mix3(C, E, u3);
  else if (u2 > 0) p = mix3(B, C, u2);
  else p = mix3(A, B, u1);
  const lift = u3 > 0 ? Math.sin(u3 * Math.PI) * 3 : 0;
  return { on: true, p: [p[0], p[1], p[2] + lift], op: ease(Math.min(1, u1 * 4)) };
}

// ---------- pose ----------
function pose(fr, t) {
  const S = {
    jib: jibKeys(fr, t),
    trays: [null, trayState(1, fr, t), trayState(2, fr, t), trayState(3, fr, t)],
    enq: 0, deq: 0, bell: 0, flash: false,
    stamp: stampPress(fr, t), dstamp: deskPress(fr, t),
    receipt: { on: false, rise: 0, enter: 0, k: 0 },
    win: false, card: 0, board: { up: 0, page: null },
  };
  if (fr === 1) {
    S.enq = ease(seg(t, 0.60, 0.68));
    S.bell = bellP(t, 0.70, 0.76, 0.82);
    S.flash = t >= 0.70 && t <= 0.88;
    S.card = t >= 0.30 ? 9 : 0;
  }
  if (fr === 2) {
    S.deq = ease(seg(t, 0.88, 0.96));
    S.receipt = { on: t >= 0.54 && t <= 0.98, rise: ease(seg(t, 0.54, 0.66)), enter: ease(seg(t, 0.86, 0.97)), k: 0 };
    S.win = S.receipt.on;
  }
  if (fr === 3) {
    S.board = { up: ease(seg(t, 0.02, 0.10)), page: "addr" };
    S.enq = 1 + ease(seg(t, 0.48, 0.54));
    S.bell = bellP(t, 0.56, 0.62, 0.68);
    S.flash = t >= 0.56 && t <= 0.74;
    S.card = t >= 0.30 ? 11 : 0;
    S.deq = 1 + ease(seg(t, 0.94, 1.0));
    S.receipt = { on: t >= 0.84, rise: ease(seg(t, 0.84, 0.93)), enter: ease(seg(t, 0.97, 1.05)), k: 1 };
    S.win = S.receipt.on;
  }
  if (fr === 4) {
    S.board = { up: 1, page: "cfg" };
    S.enq = 2 + ease(seg(t, 0.46, 0.52));
    S.bell = bellP(t, 0.54, 0.60, 0.66);
    S.flash = t >= 0.54 && t <= 0.72;
    S.card = t >= 0.30 ? 12 : 0;
    S.deq = 2 + ease(seg(t, 0.92, 1.0));
    S.receipt = { on: t >= 0.86, rise: ease(seg(t, 0.86, 0.94)), enter: ease(seg(t, 0.98, 1.06)), k: 2 };
    S.win = S.receipt.on;
  }
  return S;
}

// ---------- latched state ----------
let curCmds = 0, curDone = 0;
const RES = [false, false, false];
let round = 1, addrLatched = false;
function latch(fr, t) {
  if (fr === 1 && t >= 0.58) curCmds = Math.max(curCmds, 1);
  if (fr === 2 && t >= 0.46) { RES[0] = true; curDone = Math.max(curDone, 1); }
  if (fr === 3 && t >= 0.56) curCmds = Math.max(curCmds, 2);
  if (fr === 3 && t >= 0.96) { RES[1] = true; curDone = Math.max(curDone, 2); addrLatched = true; }
  if (fr === 4 && t >= 0.46) curCmds = Math.max(curCmds, 3);
  if (fr === 4 && t >= 0.95) { RES[2] = true; curDone = Math.max(curDone, 3); }
}
function flipRound() {
  round = round === 1 ? 0 : 1;
  curCmds = 0; curDone = 0;
}

// ---------- apply ----------
let lastArmKey = "";
function apply(S, fr, t) {
  for (let c = 1; c <= 3; c++) {
    const st = S.trays[c], el = trays[c];
    if (!st || !st.vis) { el.setAttribute("style", "display:none"); continue; }
    el.setAttribute("style", "opacity:" + (Math.round(st.op * 100) / 100));
    const mv = translateAlong(P, st.p);
    if (mv && mv !== "translate(0 0)") el.setAttribute("transform", mv); else el.removeAttribute("transform");
    el.querySelector("[data-etch]").setAttribute("style", st.etch ? "" : "display:none");
  }
  const ep = pol(135 + 45 * S.enq, D.enqR);
  const dp = pol(135 + 45 * S.deq, D.ptrR);
  ptrs.enq.setAttribute("transform", translateAlong(P, [ep[0], ep[1], D.topz]) || "");
  ptrs.deq.setAttribute("transform", translateAlong(P, [dp[0], dp[1], D.topz]) || "");
  // jib arm + trolley collar
  const [ja, jr, jz] = S.jib;
  const key = ja.toFixed(1) + "/" + jr.toFixed(1);
  if (key !== lastArmKey) {
    lastArmKey = key;
    const a = ja * RAD, ax = [Math.cos(a), Math.sin(a), 0];
    const F = G.frameAlong([D.cx, D.cy, D.armZ], ax);
    const arm = G.prismOf(F, [[-2.2, 0], [2.2, 0], [2.2, 4.5], [-2.2, 4.5]], D.jib.r0, Math.max(D.jib.r1, jr + 4), P);
    const CF = G.frameAlong([D.cx + ax[0] * jr, D.cy + ax[1] * jr, D.armZ + 1.2], ax);
    let html = solidSvg(arm, { tone: "mid" });
    html += solidSvg(G.disc(-2.4, 2.4, 3.4, CF, P, { steps: 22 }), { tone: "mid" });
    elArm.innerHTML = html;
  }
  // gripper + cables
  const gp = pol(ja, jr);
  const gm = translateAlong(P, [gp[0], gp[1], jz]);
  if (gm && gm !== "translate(0 0)") elGrip.setAttribute("transform", gm); else elGrip.removeAttribute("transform");
  let cables = elGrip.querySelector("[data-cables]");
  if (!cables) {
    cables = document.createElementNS("http://www.w3.org/2000/svg", "g");
    cables.setAttribute("data-cables", "");
    elGrip.insertBefore(cables, elGrip.firstChild);
  }
  const c1 = isoP([gp[0], gp[1], D.armZ + 0.6]);
  const e1 = isoP([gp[0] - Math.cos(ja * RAD) * 4.4, gp[1] - Math.sin(ja * RAD) * 4.4, jz + 2.6]);
  const e2 = isoP([gp[0] + Math.cos(ja * RAD) * 4.4, gp[1] + Math.sin(ja * RAD) * 4.4, jz + 2.6]);
  cables.innerHTML = wireSvg([c1[0], c1[1]], [e1[0], e1[1]], { tone: "lo", size: 1 })
    + wireSvg([c1[0], c1[1]], [e2[0], e2[1]], { tone: "lo", size: 1 });
  // bell + stamp heads
  setT(elBell, [0, 0, -2.1 * S.bell]);
  setT(elStampHead, [0, 0, -3.5 * S.stamp]);
  setT(elDeskHead, [0, 0, -3.5 * S.dstamp]);
  flash.classList.toggle("on", S.flash);
  // reader card
  for (const k of [9, 11, 12]) cards[k].setAttribute("style", S.card === k ? "" : "display:none");
  // clipboard
  setT(elClip, [0, 0, 8 * S.board.up]);
  pages.addr.setAttribute("style", S.board.page === "addr" ? "" : "display:none");
  pages.cfg.setAttribute("style", S.board.page === "cfg" ? "" : "display:none");
  // residues
  residues.forEach((el, i) => el.setAttribute("style", RES[i] ? "" : "display:none"));
  // receipt
  if (S.receipt.on) {
    elReceipt.setAttribute("style", "");
    elReceipt.querySelector('[data-r="trb"]').textContent = "Command TRB Pointer → " + S.receipt.k + " 槽";
    const dy = isoP([0, 0, -9])[1] * (1 - S.receipt.rise);
    const a0 = isoP(D.winMouth), a1 = isoP(D.ductIn);
    const tx = (a1[0] - a0[0]) * S.receipt.enter, ty = (a1[1] - a0[1]) * S.receipt.enter + dy;
    const sc = 1 - 0.85 * S.receipt.enter;
    elReceipt.setAttribute("transform", "translate(" + tx.toFixed(1) + " " + ty.toFixed(1) + ") scale(" + sc.toFixed(3) + ")");
    elReceipt.setAttribute("opacity", String(Math.round((1 - S.receipt.enter * 0.95) * 100) / 100));
  } else elReceipt.setAttribute("style", "display:none");
  // address plate
  const PS = plateState(fr, t);
  if (PS.on) {
    elPlate.setAttribute("style", "opacity:" + (Math.round(PS.op * 100) / 100));
    const mv = translateAlong(P, PS.p);
    if (mv && mv !== "translate(0 0)") elPlate.setAttribute("transform", mv); else elPlate.removeAttribute("transform");
  } else elPlate.setAttribute("style", "display:none");
  // lamps
  glow("win").classList.toggle("on", S.win);
  glow("addr").classList.toggle("on", addrLatched);
  glow("crr").classList.add("on");
  // RCS knob flips colour with the round (stage data-round drives --cyc)
  stage.setAttribute("data-round", String(round));
}
function setT(el, w) {
  const m = translateAlong(P, w);
  if (m && m !== "translate(0 0)") el.setAttribute("transform", m); else el.removeAttribute("transform");
}

// ---------- engine ----------
const FRAME_T = [2.4, 8.0, 11.0, 14.0, 12.0];
const FRAME_NAME = ["F0 全景", "F1 投单 Enable Slot", "F2 执行与回执", "F3 大单 Address Device", "F4 配置端点 Configure Endpoint"];
let fr = 0, t = 0, playing = false, tour = !still.matches, last = 0, visible = false, frame = 0;

function step(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if ((tour && !still.matches) || playing) {
    t += dt / FRAME_T[fr];
    if (t >= 1) {
      if (fr === 4) flipRound();
      fr = (fr + 1) % 5;
      t = 0;
      if (!tour) playing = false;
      announce();
    }
  }
  latch(fr, t);
  apply(pose(fr, Math.min(t, 1)), fr, t);
  const text = "命令 " + curCmds + " · 完成 " + curDone + " · RCS 色 " + round;
  if (readout.textContent !== text) readout.textContent = text;
  frame = visible && ((tour && !still.matches) || playing || t < 1) ? requestAnimationFrame(step) : 0;
}
function announce() {
  statusEl.textContent = FRAME_NAME[fr];
  wrap.setAttribute("aria-label", "命令环订单柜台，当前" + FRAME_NAME[fr] + "。点击步进，空格巡游，左右箭头切帧。");
}
function kick() { if (!frame && visible) { last = 0; frame = requestAnimationFrame(step); } }
function readoutNow() {
  wrap.dataset.dbg = "n=" + (wrap.dataset.clicked || 0) + " fr=" + fr + " t=" + (Math.round(t * 100) / 100) + " cmds=" + curCmds + " click=1";
  const text = "命令 " + curCmds + " · 完成 " + curDone + " · RCS 色 " + round;
  if (readout.textContent !== text) readout.textContent = text;
}
function nextFrame() {
  tour = false;
  if (t > 0 && t < 1) {
    t = 1; playing = false;
    latch(fr, 1); apply(pose(fr, 1), fr, 1);
    readoutNow();
    if (fr === 0) { fr = 1; t = 0; playing = true; announce(); } // F0 是静景：直接接 F1
    return;
  }
  if (fr === 4) flipRound();
  fr = (fr + 1) % 5; t = 0; playing = true;
  readoutNow();
  announce(); kick();
}
function prevFrame() {
  tour = false; playing = false;
  if (fr === 0) { fr = 4; } else fr -= 1;
  t = 1;
  announce(); kick();
}
wrap.addEventListener("click", () => {
  wrap.dataset.clicked = String(Number(wrap.dataset.clicked || 0) + 1);
  try { nextFrame(); } catch (err) { wrap.dataset.err = String(err); }
});
wrap.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); nextFrame(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); prevFrame(); }
  else if (e.key === " ") { e.preventDefault(); tour = !tour && !still.matches; kick(); }
  else if (e.key === "Escape") { tour = false; kick(); }
});
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) kick();
}, { rootMargin: "120px 0px" }).observe(wrap);
if (still.matches) tour = false;
announce();
apply(pose(0, 0), 0, 0);
kick();
</script></body></html>
